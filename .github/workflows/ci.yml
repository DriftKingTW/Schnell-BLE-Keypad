name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so version.py can run git describe

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        # intelhex is imported by the esptool version pinned in platformio.ini.
        # PlatformIO does not install esptool's dependencies, and esptool runs
        # during a plain `pio run` (elf2image), so the build needs it too.
        run: pip install --upgrade platformio intelhex

      - name: Build firmware
        run: pio run
