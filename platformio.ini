; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-wroom-1-n4r2]
platform = espressif32@6.3.2
board = esp32-s3-wroom-1-n4r2
framework = arduino
# esptool 4.5.1, the version espressif32@6.3.2 pins, cannot reset this board out
# of download mode -- its hard reset drives RTS, and the S3's native USB has no
# auto-reset circuit for that to reach, so flashing always ended with the board
# sitting in the ROM downloader. Newer esptool drives the USB-Serial-JTAG reset
# correctly and leaves the app running.
# Needs the `intelhex` module in PlatformIO's Python env: esptool imports it and
# PlatformIO does not install esptool's dependencies:
#     ~/.platformio/penv/bin/pip install intelhex
platform_packages =
	platformio/tool-esptoolpy@2.41100.0
lib_deps =
	NimBLE-Arduino@1.4.1
	t-vk/ESP32 BLE Keyboard@0.3.2
	olikraus/U8g2@^2.28.8
	bblanchon/ArduinoJson@^6.19.4
	xreef/PCF8574 library@^2.3.4
	jnthas/Improv WiFi Library@0.0.4
	madhephaestus/ESP32Encoder@^0.10.2
	paulstoffregen/Encoder@^1.4.2
	fastled/FastLED@^3.6.0
build_flags = -D USE_NIMBLE
monitor_speed = 115200
board_build.partitions = no_ota.csv
extra_scripts =
	pre:scripts/version.py
	pre:scripts/enter_bootloader.py
	scripts/merge_firmware.py
